<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тишина — ридер</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="parser.js?v=32"></script>
<script src="store.js?v=32"></script>
<style>
@font-face{font-family:'Tishina Times';src:url('fonts/times.ttf') format('truetype');font-display:swap}
:root{
  --ink:#1c1c1e; --muted:#8e8e93; --line:#e9e9ee; --bg:#ffffff; --bg2:#f6f6f8;
  --accent:#c65b4e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Manrope',-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--ink);
  min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:0 20px}

/* шапка */
.top{position:relative;overflow:hidden;
  margin:0 -20px;padding:34px 20px 40px;border-radius:0 0 32px 32px;
  background:linear-gradient(140deg,#d4695c 0%,#c65b4e 45%,#a84338 100%);color:#fff;
  box-shadow:0 8px 28px rgba(198,91,78,.32)}
.top::before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;
  background:rgba(255,255,255,.09);top:-70px;right:-50px}
.top::after{content:"";position:absolute;width:140px;height:140px;border-radius:50%;
  background:rgba(255,255,255,.07);bottom:-50px;left:30px}
.top-head{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between}
.top h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:38px;margin:0;letter-spacing:-.01em;color:#fff;position:relative;z-index:1}
.top-quote{position:relative;z-index:1;margin:12px 0 0;font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:15.5px;line-height:1.45;color:rgba(255,255,255,.88);max-width:78%}
.top-quote b{display:block;margin-top:6px;font-style:normal;font-family:'Manrope',sans-serif;
  font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.65)}
.top-count{position:relative;z-index:1;margin-top:14px;display:inline-block;
  background:rgba(255,255,255,.2);color:#fff;font-size:12px;font-weight:700;
  padding:6px 14px;border-radius:999px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

/* нижний навбар */
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:rgba(255,255,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--line);padding:8px 0 calc(10px + env(safe-area-inset-bottom));
  display:flex;justify-content:space-around}
.navbtn{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-family:inherit;font-size:10.5px;font-weight:700;color:var(--muted);cursor:pointer;padding:4px 20px}
.navbtn svg{width:24px;height:24px}
.navbtn.on{color:var(--accent)}
.navbtn:active{opacity:.6}
.top h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:36px;margin:0;letter-spacing:-.01em;color:#fff}
.add-btn{width:44px;height:44px;border-radius:50%;border:none;background:rgba(255,255,255,.22);color:#fff;
  font-size:26px;font-weight:300;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.add-btn:active{transform:scale(.92);background:rgba(255,255,255,.32)}
.add-btn:active{transform:scale(.92)}

/* текущая книга — hero */
.hero-card{display:flex;gap:20px;padding:22px;background:var(--bg2);border-radius:24px;
  margin:6px 0 28px;cursor:pointer;box-shadow:0 8px 32px rgba(0,0,0,.10)}
.hero-cover{flex:0 0 120px;perspective:600px}
.hero-cover .cover{width:120px;aspect-ratio:2/3;object-fit:cover;border-radius:10px;display:block;
  box-shadow:12px 14px 30px rgba(0,0,0,.28);transform:rotateY(-8deg);transform-origin:left center}
.hero-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.hero-label{font-size:11px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.hero-title{font-size:22px;font-weight:800;margin:0 0 4px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero-author{font-size:14px;color:var(--muted);margin:0 0 16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-card .pbar{margin-bottom:10px;height:5px}
.hero-foot{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.hero-pct{font-size:14px;color:var(--muted);font-weight:700}
.hero-btn{margin:0;padding:12px 26px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.pbar{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:8px}
.pbar i{display:block;height:100%;background:var(--ink);border-radius:99px}
.read-btn{margin-top:12px;border:none;background:var(--accent);color:#fff;font-family:inherit;font-weight:700;
  font-size:14px;padding:11px 26px;border-radius:999px;cursor:pointer;
  box-shadow:0 4px 16px rgba(198,91,78,.35)}
.read-btn:active{transform:scale(.96)}

/* секция */
.sec{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);
  margin:26px 0 14px}

/* недавние */
.recent{display:flex;gap:16px;overflow-x:auto;padding:2px 20px 8px;margin:0 -20px;scrollbar-width:none}
.recent::-webkit-scrollbar{display:none}
.rec{flex:0 0 104px;cursor:pointer}
.rec .cover{width:104px;height:150px;object-fit:cover;border-radius:6px;box-shadow:0 6px 16px rgba(0,0,0,.18);background:var(--bg2)}
.rec .rt{font-size:12px;font-weight:700;margin:8px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .rp{font-size:11px;color:var(--muted);font-weight:600}

/* библиотека — полка как в Apple Books */
.lib-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:26px 20px;padding-top:8px}
.book{cursor:pointer;position:relative}
.book .cover-wrap{position:relative}
.book .cover{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:10px;box-shadow:0 10px 24px rgba(0,0,0,.16);background:var(--bg2);display:block}
.book .bt{font-size:13.5px;font-weight:700;margin:10px 0 2px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.book .ba{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.book .cover-wrap{position:relative}
.book .bdots{position:absolute;top:8px;right:8px;border:none;background:rgba(0,0,0,.5);color:#fff;
  font-size:15px;font-weight:800;padding:3px 9px 5px;border-radius:999px;cursor:pointer;line-height:1;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.book .bdots:active{opacity:.6}
.book .bprog{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.55);color:#fff;
  font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.book .bnew{position:absolute;bottom:8px;left:8px;background:#0a84ff;color:#fff;font-size:10px;
  font-weight:800;padding:4px 9px;border-radius:999px;letter-spacing:.04em}
.book .bmeta{display:none}

.cover-ph{display:flex;align-items:center;justify-content:center;background:linear-gradient(150deg,#d99a7c,#8a5f4d);
  color:#fff;font-family:'Cormorant Garamond',serif;font-style:italic;text-align:center;padding:10px;font-size:15px}
.rec .cover-ph,.book .cover-ph,.now-card .cover-ph{background:linear-gradient(150deg,#d99a7c,#8a5f4d)}

/* пусто */
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty-img{width:180px;height:auto;margin-bottom:8px;pointer-events:none}
.empty .big{font-size:52px;margin-bottom:12px}
.empty p{font-size:15px;line-height:1.55;margin:0 0 20px}

/* таб-бар */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.88);backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);z-index:40;
  padding-bottom:env(safe-area-inset-bottom)}
.tabs{max-width:560px;margin:0 auto;display:flex}
.tab{flex:1;border:none;background:none;cursor:pointer;padding:10px 0 12px;display:flex;flex-direction:column;
  align-items:center;gap:3px;color:var(--muted);font-family:inherit;font-size:10.5px;font-weight:700}
.tab svg{width:25px;height:25px}
.tab.on{color:var(--ink)}

/* детали книги */
.detail{position:fixed;inset:0;background:var(--bg);z-index:50;overflow-y:auto;transform:translateY(100%);transition:transform .3s ease}
.detail.open{transform:translateY(0)}
.d-hero{position:relative;overflow:hidden;padding:calc(12px + env(safe-area-inset-top)) 16px 0}
.d-hero-bg{position:absolute;inset:-20px;background-size:cover;background-position:center;
  filter:blur(12px) saturate(1.3);opacity:.45;transform:scale(1.08)}
.d-hero-bg.ph{background:linear-gradient(135deg,#3a3a3f,#6b6b72)}
.d-nav{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center}
.d-navbtn{border:none;width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer;
  background:rgba(255,255,255,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  color:#1c1c1e;font-family:inherit;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.d-cover{position:relative;z-index:1;width:186px;margin:14px auto 0}
.d-cover .cover{width:100%;border-radius:14px;box-shadow:0 18px 44px rgba(0,0,0,.35);display:block}
.d-cover .cover-ph{width:100%;aspect-ratio:2/3;border-radius:14px;background:linear-gradient(135deg,#3a3a3f,#6b6b72);
  color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;
  font-size:20px;padding:18px;text-align:center;box-shadow:0 18px 44px rgba(0,0,0,.35)}
.d-body{position:relative;background:var(--bg);border-radius:30px 30px 0 0;margin-top:-30px;
  padding:30px 22px 70px;max-width:560px;margin-left:auto;margin-right:auto}
.d-body h2{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:30px;margin:0 0 4px;line-height:1.15;text-align:center}
.d-body .da{color:var(--muted);font-size:15px;margin:0 0 18px;text-align:center}
.d-read{display:block;width:100%;padding:16px;font-size:17px;border-radius:999px;margin:0 0 16px;
  background:var(--accent);color:#fff;border:none;font-family:inherit;font-weight:800;cursor:pointer}
.d-read:active{transform:scale(.98)}
.d-prog{display:flex;align-items:center;justify-content:space-between;gap:14px;
  background:var(--bg2);border-radius:20px;padding:16px 18px;margin:0 0 6px}
.d-prog-t{font-weight:800;font-size:16px;margin-bottom:3px}
.d-prog-s{color:var(--muted);font-size:13.5px}
.ring{position:relative;width:64px;height:64px;flex:0 0 auto}
.ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5;stroke-linecap:round}
.ring .ring-bg{stroke:#e4e4e9}
.ring .ring-fg{stroke:var(--accent);stroke-dasharray:119.4;stroke-dashoffset:119.4}
.ring span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:800;color:var(--accent)}
.d-sec{margin-top:22px}
.d-sec-t{font-weight:800;font-size:19px;margin-bottom:10px}
.d-desc{color:#55555c;font-size:15px;line-height:1.6;margin:0;text-align:justify}
.d-toc{border-top:1px solid var(--line)}
.d-toc .row{display:flex;justify-content:space-between;align-items:center;padding:13px 2px;border-bottom:1px solid var(--line);
  font-size:15px;cursor:pointer}
.d-toc .row span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-right:12px}
.d-toc .row .n{color:var(--muted);font-size:13px;flex:0 0 auto}
.d-del{display:block;width:100%;border:none;background:none;color:#d33;font-family:inherit;
  font-size:15px;font-weight:700;cursor:pointer;margin-top:26px;padding:12px}

/* тост */
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:rgba(28,28,30,.92);color:#fff;font-size:14px;font-weight:600;padding:12px 22px;border-radius:999px;
  opacity:0;transition:.25s;z-index:80;pointer-events:none;max-width:86vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hidden{display:none!important}

/* меню книги (action sheet) */
.sheet{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .25s}
.sheet.open{opacity:1;pointer-events:auto}
.sheet-card{width:100%;max-width:560px;background:var(--bg);border-radius:22px 22px 0 0;
  padding:10px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(103%);transition:transform .3s ease}
.sheet.open .sheet-card{transform:none}
.sheet-title{font-size:15px;font-weight:800;text-align:center;padding:10px 0 6px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-btn{display:block;width:100%;border:none;background:var(--bg2);font-family:inherit;font-size:16px;
  font-weight:600;color:var(--ink);padding:15px;border-radius:14px;margin-top:8px;cursor:pointer}
.sheet-btn:active{opacity:.6}
.sheet-btn.danger{color:#ff3b30}
.sheet-btn.cancel{background:none;color:var(--accent);font-weight:800}

/* ридер */
.reader{--rbg:#ffffff;--rink:#1c1c1e;--rmuted:#8e8e93;--rline:#e9e9ee;--rbar:rgba(255,255,255,.94);--rbgimg:none;
  position:fixed;inset:0;background-color:var(--rbg);background-image:var(--rbgimg);color:var(--rink);z-index:70;display:flex;flex-direction:column;
  transform:translateY(102%);transition:transform .3s ease}
.reader[data-bg="cream"]{--rbg:#f3f0e4;--rink:#2c2620;--rmuted:#8a7d68;--rline:#e0d4b8;--rbgimg:url('bg/cream.png')}
.reader[data-bg="sepia"]{--rbg:#f3e9d2;--rink:#43382b;--rmuted:#8a7a5f;--rline:#e0d2b2;--rbgimg:none}
.reader[data-bg="blue"]{--rbg:#98babc;--rink:#1f2a30;--rmuted:#54696f;--rline:#86a3a8;--rbgimg:url('bg/blue.png')}
.reader[data-bg="sand"]{--rbg:#dcc2a1;--rink:#33291c;--rmuted:#77644c;--rline:#c6a67f;--rbgimg:url('bg/sand.png')}
.reader[data-bg="night"]{--rbg:#17171a;--rink:#e8e3d8;--rmuted:#98989d;--rline:#2c2c31;--rbgimg:none}
.reader.open{transform:none}
.r-top{position:absolute;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;z-index:5;
  display:flex;align-items:center;gap:12px;padding:10px 14px;
  background:rgba(255,255,255,.97);border-radius:22px;
  box-shadow:0 10px 30px rgba(0,0,0,.18);
  transition:transform .28s ease,opacity .28s ease}
.r-top.gone{transform:translateY(-140%);opacity:0;pointer-events:none}
.r-back{border:none;background:#ececf0;width:38px;height:38px;border-radius:50%;font-size:17px;cursor:pointer;color:#1c1c1e;flex:0 0 auto}
/* верх/низ всегда белые — текст в них тоже фиксированный тёмный */
.r-top,.r-bottom{--rink:#1c1c1e;--rmuted:#8e8e93;--rline:#e9e9ee}
.r-title{flex:1;min-width:0;font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-aa{border:none;background:none;font-size:21px;font-weight:600;cursor:pointer;color:var(--rink);padding:6px 8px;flex:0 0 auto;font-family:inherit}
.r-pct{font-size:13px;color:var(--rmuted);font-weight:700;flex:0 0 auto}
.r-content{flex:1;overflow:hidden;position:relative;cursor:pointer;
  padding:calc(20px + env(safe-area-inset-top)) 24px calc(20px + env(safe-area-inset-bottom))}
.r-pages{height:100%;column-fill:auto;-webkit-column-fill:auto;overflow:hidden;font-size:var(--rfs,18.5px)}
.r-pages p{font-family:Georgia,'Times New Roman',serif;font-size:1em;line-height:1.68;margin:0 0 1em;color:var(--rink);
  text-align:justify;hyphens:auto;-webkit-hyphens:auto;text-indent:2em}
.reader.ff-sans .r-pages p{font-family:-apple-system,'Manrope',system-ui,sans-serif}
.reader.ff-times .r-pages p{font-family:'Tishina Times',Georgia,serif}
.r-pages p.no-indent,.r-chapter-label + p{text-indent:0}
.r-pages h1,.r-pages h2{font-family:'Cormorant Garamond',serif;font-weight:600;break-after:avoid;margin:0 0 .7em;line-height:1.25;color:var(--rink);font-size:1.4em}
.r-pages h3{font-family:'Cormorant Garamond',serif;font-weight:600;break-after:avoid;margin:0 0 .7em;line-height:1.3;
  color:var(--rink);font-size:1.25em;text-align:center}
.r-pages a.fn{color:#2f7cf6;text-decoration:none;
  font-size:.75em;vertical-align:super;line-height:1;cursor:pointer}
.r-pages img{max-width:100%;height:auto;break-inside:avoid;border-radius:8px}
.r-pages blockquote,.r-pages figure{break-inside:avoid;margin:0 0 1em;padding-left:14px;border-left:3px solid var(--rline);
  font-family:Georgia,serif;font-style:italic;color:var(--rink)}
.r-chapter-label{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:1.5em;
  margin:0 0 18px;break-after:avoid;line-height:1.2;color:var(--rink);text-align:left}
.r-bottom{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom));left:12px;right:12px;z-index:5;
  padding:14px 18px 16px;background:rgba(255,255,255,.97);border-radius:22px;
  box-shadow:0 10px 30px rgba(0,0,0,.18);
  transition:transform .28s ease,opacity .28s ease}
.r-bottom.gone{transform:translateY(140%);opacity:0;pointer-events:none}
.r-bottom .row{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;color:var(--rmuted);
  font-weight:600;margin-bottom:9px}
.r-bottom .row span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* шторка настроек */
.r-set{position:fixed;inset:0;z-index:90;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .25s}
.r-set.open{opacity:1;pointer-events:auto}
/* меню всегда одного цвета — не красятся в фон страниц */
.r-set-card,.r-draw-panel,.r-note-card{
  --rbg:#ffffff;--rink:#1c1c1e;--rmuted:#8e8e93;--rline:#e9e9ee;--rbar:#ffffff;--rbgimg:none}
.r-set-card{width:100%;max-width:560px;background:var(--rbar);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border-radius:22px 22px 0 0;padding:8px 22px calc(24px + env(safe-area-inset-bottom));
  transform:translateY(103%);transition:transform .28s ease;color:var(--rink)}
.r-set.open .r-set-card{transform:none}
.r-set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;
  border-bottom:1px solid var(--rline);font-weight:700;font-size:15px}
.r-set-row:last-child{border-bottom:none}
.seg{display:flex;background:rgba(120,120,128,.16);border-radius:12px;padding:3px;gap:2px}
.seg button{border:none;background:none;font-family:inherit;font-weight:700;font-size:13.5px;padding:8px 13px;
  border-radius:9px;cursor:pointer;color:var(--rink)}
.seg button.on{background:var(--rbg);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--rline);background:var(--rbg);
  color:var(--rink);font-size:15px;font-weight:800;cursor:pointer;font-family:inherit}
.stepper button:active{transform:scale(.93)}
#fsVal{min-width:30px;text-align:center;font-size:16px}
.r-row-right{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.r-gear{border:none;background:none;font-size:17px;color:var(--rmuted);cursor:pointer;padding:2px 4px;font-family:inherit}
.r-gear:active{transform:rotate(40deg)}

/* выбор фона */
.bg-pick{display:flex;gap:4px;flex-wrap:wrap}
.bg-pick button{border:none;background:none;font-family:inherit;font-size:11px;font-weight:700;color:var(--rmuted);
  display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;padding:4px 2px;min-width:54px}
.bg-pick button i{width:44px;height:44px;border-radius:50%;display:block;
  border:1px solid var(--rline);box-shadow:inset 0 0 0 3px rgba(255,255,255,.22)}
.bg-pick [data-bg="white"] i{background:#ffffff}
.bg-pick [data-bg="cream"] i{background:#f3f0e4 url('bg/cream.png')}
.bg-pick [data-bg="sepia"] i{background:#f3e9d2}
.bg-pick [data-bg="blue"] i{background:#98babc url('bg/blue.png')}
.bg-pick [data-bg="sand"] i{background:#dcc2a1 url('bg/sand.png')}
.bg-pick [data-bg="night"] i{background:#17171a}
.bg-pick button.on{color:var(--rink)}
.bg-pick button.on i{box-shadow:0 0 0 2px var(--rbg),0 0 0 4px var(--rink)}

/* шторка глав/закладок */
.r-draw{position:absolute;inset:0;z-index:11;pointer-events:none}
.r-draw::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.35);opacity:0;transition:opacity .3s}
.r-draw.open{pointer-events:auto}
.r-draw.open::after{opacity:1}
.r-draw-panel{position:absolute;top:0;bottom:0;left:0;width:min(340px,88%);z-index:1;
  background-color:var(--rbg);background-image:var(--rbgimg);color:var(--rink);
  border-right:1px solid var(--rline);display:flex;flex-direction:column;
  transform:translateX(-104%);transition:transform .32s cubic-bezier(0.25,0.46,0.45,0.94);
  padding-top:env(safe-area-inset-top);box-shadow:10px 0 34px rgba(0,0,0,.2)}
.r-draw.open .r-draw-panel{transform:none}
.r-draw-head{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:14px 14px 12px;border-bottom:1px solid var(--rline)}
.r-draw-list{flex:1;overflow-y:auto;padding:4px 0;-webkit-overflow-scrolling:touch}
.ch-row{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  border:none;background:none;text-align:left;font-family:inherit;cursor:pointer;
  font-size:15px;font-weight:600;color:var(--rink);padding:13px 20px;
  border-bottom:1px dashed var(--rline)}
.ch-row .tick{color:#c65b4e;font-weight:800;flex:0 0 auto}
.ch-row.cur .ch-label{font-weight:800}
.bm-add{display:block;width:calc(100% - 40px);margin:12px 20px;padding:12px;border-radius:14px;
  border:1.5px dashed var(--rmuted);background:none;color:var(--rink);font-family:inherit;
  font-size:14px;font-weight:700;cursor:pointer}
.bm-row{display:flex;align-items:flex-start;gap:6px;border-bottom:1px dashed var(--rline);padding:12px 12px 12px 20px}
.bm-go{flex:1;min-width:0;border:none;background:none;text-align:left;font-family:inherit;cursor:pointer;padding:0;color:var(--rink)}
.bm-snippet{font-size:14px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bm-meta{font-size:12px;color:var(--rmuted);margin-top:5px;font-weight:600}
.bm-del{border:none;background:none;color:var(--rmuted);font-size:15px;cursor:pointer;padding:4px 8px;font-family:inherit;flex:0 0 auto}
.bm-empty{padding:26px 20px;color:var(--rmuted);font-size:14px;text-align:center}
.about-wrap{padding:18px 22px 26px;text-align:center}
.about-cover img{width:120px;border-radius:8px;box-shadow:0 10px 26px rgba(0,0,0,.25)}
.about-cover .cover-ph{width:120px;aspect-ratio:2/3;margin:0 auto;border-radius:8px;
  background:linear-gradient(135deg,#3a3a3f,#6b6b72);color:#fff;display:flex;align-items:center;
  justify-content:center;font-family:'Cormorant Garamond',serif;font-size:16px;padding:10px;
  box-shadow:0 10px 26px rgba(0,0,0,.25)}
.about-title{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:22px;margin:14px 0 2px}
.about-author{color:var(--rmuted);font-size:14px;margin-bottom:14px}
.about-desc{color:var(--rink);font-size:14.5px;line-height:1.6;text-align:justify;margin:0 0 12px}
.about-desc.empty{color:var(--rmuted);text-align:center}
.about-meta{color:var(--rmuted);font-size:12.5px;font-weight:700}
.r-draw-foot{padding:12px 20px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--rline);
  font-size:13px;font-weight:700;color:var(--rmuted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-set-row-col{flex-direction:column;align-items:stretch;gap:10px}
.fx-group{display:flex;flex-wrap:wrap;gap:8px}
.fx-group button{border:none;background:rgba(120,120,128,.16);font-family:inherit;font-weight:700;font-size:13px;
  padding:9px 14px;border-radius:999px;cursor:pointer;color:var(--rink)}
.fx-group button.on{background:var(--rink);color:var(--rbg)}

/* попап сноски */
.r-note{position:absolute;inset:0;z-index:9;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(0,0,0,.32);opacity:0;pointer-events:none;transition:opacity .25s}
.r-note.open{opacity:1;pointer-events:auto}
.r-note-card{width:100%;max-width:560px;max-height:62%;overflow-y:auto;background:var(--rbar);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);color:var(--rink);
  border-radius:22px 22px 0 0;padding:14px 24px calc(28px + env(safe-area-inset-bottom));
  transform:translateY(103%);transition:transform .28s ease}
.r-note.open .r-note-card{transform:none}
.r-note-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.r-note-title{font-weight:800;font-size:14px;color:var(--rmuted);text-transform:uppercase;letter-spacing:.06em}
.r-note-x{border:none;background:var(--rline);width:32px;height:32px;border-radius:50%;font-size:15px;
  color:var(--rink);cursor:pointer;font-family:inherit}
.r-note-text{font-family:Georgia,serif;font-size:16.5px;line-height:1.65;text-align:justify}
.reader.ff-times .r-note-text{font-family:'Tishina Times',Georgia,serif}
.reader.ff-sans .r-note-text{font-family:-apple-system,'Manrope',system-ui,sans-serif}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="top-head">
      <h1 id="pageTitle">Полка</h1>
      <button class="add-btn" id="addBtn" title="Добавить книгу">+</button>
    </div>
    <p class="top-quote">«Чтение — это путешествие,<br>не выходя из дома.»<b>Твоя библиотека</b></p>
    <span class="top-count" id="topCount" hidden></span>
  </div>
  <div id="viewShelf"></div>
</div>

<nav class="navbar">
  <button class="navbtn on" id="navHome">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/></svg>
    Домой
  </button>
  <button class="navbtn" id="navSet">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    Настройки
  </button>
</nav>

<div class="detail" id="detail">
  <div class="d-hero" id="dHero">
    <div class="d-hero-bg" id="dHeroBg"></div>
    <div class="d-nav">
      <button class="d-navbtn" id="dClose">←</button>
      <button class="d-navbtn" id="dGear">⚙</button>
    </div>
    <div class="d-cover" id="dCover"></div>
  </div>
  <div class="d-body">
    <h2 id="dTitle"></h2>
    <p class="da" id="dAuthor"></p>
    <button class="read-btn d-read" id="dRead">Читать</button>
    <div class="d-prog" id="dProg" hidden>
      <div class="d-prog-info">
        <div class="d-prog-t">Прогресс чтения</div>
        <div class="d-prog-s">Продолжите с того же места</div>
      </div>
      <div class="ring"><svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="19" class="ring-bg"/><circle cx="22" cy="22" r="19" class="ring-fg" id="dRingFg"/></svg><span id="dPct">0%</span></div>
    </div>
    <div class="d-sec" id="dDescSec" hidden>
      <div class="d-sec-t">Описание</div>
      <p class="d-desc" id="dDesc"></p>
    </div>
    <div class="d-sec">
      <div class="d-sec-t">Оглавление</div>
      <div class="d-toc" id="dToc"></div>
    </div>
    <button class="d-del" id="dDel">Удалить книгу</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="sheet" id="bookMenu">
  <div class="sheet-card">
    <div class="sheet-title" id="bmTitle">Книга</div>
    <button class="sheet-btn" id="bmOpen">Подробнее</button>
    <button class="sheet-btn danger" id="bmDelShelf">Удалить с полки</button>
    <button class="sheet-btn danger" id="bmDelDevice">Удалить с устройства</button>
    <button class="sheet-btn cancel" id="bmCancel">Отмена</button>
  </div>
</div>

<input type="file" id="fileInput" accept=".epub,.fb2,.zip" class="hidden">

<div class="reader" id="reader">
  <div class="r-top" id="rTop">
    <button class="r-back" id="rBack">←</button>
    <button class="r-back" id="rMenu">☰</button>
    <div class="r-title" id="rTitle"></div>
    <button class="r-aa" id="rAa">Aa</button>
    <div class="r-pct" id="rPct"></div>
  </div>
  <div class="r-content" id="rContent"><div class="r-pages" id="rPages"></div></div>
  <div class="r-bottom" id="rBottom">
    <div class="row"><span id="rCh"></span><span id="rPageInfo"></span></div>
    <div class="pbar"><i id="rBar"></i></div>
  </div>
  <div class="r-note" id="rNote">
    <div class="r-note-card">
      <div class="r-note-head"><span class="r-note-title">Пояснение</span><button class="r-note-x" id="rNoteX">✕</button></div>
      <div class="r-note-text" id="rNoteText"></div>
    </div>
  </div>
  <div class="r-draw" id="rDraw">
    <div class="r-draw-panel">
      <div class="r-draw-head">
        <div class="seg" id="drawTabs">
          <button data-tab="ch" class="on">Главы</button><button data-tab="bm">Закладки</button><button data-tab="about">О книге</button>
        </div>
        <button class="r-note-x" id="rDrawX">✕</button>
      </div>
      <div class="r-draw-list" id="rDrawCh"></div>
      <div class="r-draw-list" id="rDrawBm" hidden>
        <button class="bm-add" id="bmAdd">+ Добавить закладку</button>
        <div id="rBmList"></div>
      </div>
      <div class="r-draw-list" id="rDrawAbout" hidden>
        <div class="about-wrap">
          <div class="about-cover" id="abCover"></div>
          <div class="about-title" id="abTitle"></div>
          <div class="about-author" id="abAuthor"></div>
          <p class="about-desc" id="abDesc"></p>
          <div class="about-meta" id="abMeta"></div>
        </div>
      </div>
      <div class="r-draw-foot" id="rDrawFoot"></div>
    </div>
  </div>
</div>

  <div class="r-set" id="rSet">
    <div class="r-set-card">
      <div class="r-set-row"><span>Размер шрифта</span>
        <div class="stepper"><button id="fsMinus">A−</button><span id="fsVal">19</span><button id="fsPlus">A+</button></div>
      </div>
      <div class="r-set-row"><span>Шрифт</span>
        <div class="seg" id="fontSeg"><button data-font="serif" class="on">Serif</button><button data-font="times">Times</button><button data-font="sans">Sans</button></div>
      </div>
      <div class="r-set-row r-set-row-col"><span>Фон страниц</span>
        <div class="bg-pick" id="bgPick">
          <button data-bg="white" class="on"><i></i>Белый</button><button data-bg="cream"><i></i>Крем</button><button data-bg="sepia"><i></i>Сепия</button><button data-bg="blue"><i></i>Голубой</button><button data-bg="sand"><i></i>Песочный</button><button data-bg="night"><i></i>Ночь</button>
        </div>
      </div>
      <div class="r-set-row r-set-row-col"><span>Перелистывание</span>
        <div class="fx-group" id="fxGroup">
          <button data-fx="none">Нет</button><button data-fx="slide" class="on">Слайд</button><button data-fx="shift">Сдвиг</button><button data-fx="fade">Затухание</button><button data-fx="curl">Переворот</button>
        </div>
      </div>
    </div>
  </div>
<script src="reader.js?v=32"></script>
<script src="app.js?v=32"></script>
</body>
</html>
