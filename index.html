<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тишина — спокойное чтение</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#d9735f; --bg2:#b4503f;
  --paper:#f8f1e4; --paper2:#f3e9d6;
  --ink:#3a2b23; --muted:#93806f;
  --pill:#c65b4e; --pill-ink:#fff;
  --shadow:0 14px 34px rgba(70,25,12,.28);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Manrope',system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(165deg,var(--bg1) 0%,var(--bg2) 100%);
  background-attachment:fixed;min-height:100vh;
}
.wrap{max-width:560px;margin:0 auto;padding:30px 18px 70px}

/* шапка */
.brand{text-align:center;color:#fff;margin-bottom:22px}
.brand h1{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:52px;margin:0;letter-spacing:.01em}
.brand p{margin:6px 0 0;font-size:11px;letter-spacing:.32em;text-transform:uppercase;opacity:.88}

/* история дня */
.daily{background:var(--paper);border-radius:26px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:22px;display:flex;min-height:150px;cursor:pointer}
.daily .d-art{flex:0 0 42%}
.daily .d-art svg{display:block;width:100%;height:100%}
.daily .d-body{padding:18px 18px 16px;display:flex;flex-direction:column;justify-content:center}
.daily .d-tag{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--pill);font-weight:700;margin-bottom:6px}
.daily h2{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:27px;margin:0 0 4px;line-height:1.08}
.daily .d-ex{font-size:13px;color:var(--muted);line-height:1.5;margin:0}

/* чипы настроений */
.chips{display:flex;gap:9px;overflow-x:auto;padding:2px 2px 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1.5px solid rgba(255,255,255,.65);background:rgba(255,255,255,.14);color:#fff;
  border-radius:999px;padding:9px 17px;font-size:13.5px;font-weight:600;font-family:inherit;cursor:pointer;transition:.2s}
.chip.on{background:#fff;color:var(--pill);border-color:#fff}

/* сетка карточек */
.grid{display:grid;grid-template-columns:1fr;gap:18px}
@media(min-width:480px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--paper);border-radius:26px;box-shadow:var(--shadow);padding:22px 20px 20px;
  display:flex;flex-direction:column;position:relative;cursor:pointer;transition:transform .18s}
.card:active{transform:scale(.985)}
.card .fav{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;border:none;cursor:pointer;
  background:rgba(255,255,255,.75);font-size:17px;line-height:1;color:#b06a5e;display:flex;align-items:center;justify-content:center;z-index:2}
.card .fav.liked{background:var(--pill);color:#fff}
.kicker{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card h3{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:31px;margin:8px 0 6px;line-height:1.12}
.ex{font-size:13.5px;color:var(--muted);line-height:1.55;margin:0 0 4px;flex:0 0 auto}
.art{border-radius:18px;overflow:hidden;margin:14px 0 16px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
.art svg{display:block;width:100%;height:auto}
.pill{align-self:center;border:none;cursor:pointer;background:var(--pill);color:var(--pill-ink);
  font-family:inherit;font-weight:700;font-size:14px;letter-spacing:.06em;padding:13px 34px;border-radius:999px;
  box-shadow:0 6px 16px rgba(198,91,78,.4);transition:.2s;margin-top:auto}
.pill:active{transform:scale(.96)}
.meta{display:flex;gap:10px;margin-top:10px;font-size:11.5px;color:var(--muted)}
.meta span{display:flex;align-items:center;gap:5px}

/* экран чтения */
.reader{position:fixed;inset:0;background:var(--paper);z-index:50;overflow-y:auto;transform:translateY(100%);transition:transform .32s ease}
.reader.open{transform:translateY(0)}
.reader .r-wrap{max-width:560px;margin:0 auto;padding:0 0 60px}
.r-top{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;background:rgba(248,241,228,.92);backdrop-filter:blur(8px);z-index:5}
.r-back{border:none;background:none;font-size:15px;font-weight:700;color:var(--ink);cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px}
.r-fav{border:none;background:none;font-size:22px;cursor:pointer;color:#b06a5e}
.r-fav.liked{color:var(--pill)}
.r-hero{margin:6px 18px 0;border-radius:22px;overflow:hidden}
.r-hero svg{display:block;width:100%}
.r-body{padding:24px 26px 0}
.r-body .kicker{margin-bottom:8px;display:block}
.r-body h2{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:40px;margin:0 0 6px;line-height:1.1}
.r-sub{color:var(--muted);font-size:13px;margin:0 0 20px}
.r-body p{font-family:'Cormorant Garamond',serif;font-size:21px;line-height:1.72;margin:0 0 1.2em;color:#2f241d}
.r-foot{display:flex;gap:12px;justify-content:center;padding:26px}
.r-next{background:none;border:1.5px solid var(--pill);color:var(--pill);font-family:inherit;font-weight:700;
  font-size:14px;padding:13px 28px;border-radius:999px;cursor:pointer}

.empty{text-align:center;color:#fff;opacity:.85;padding:40px 10px;font-size:15px}
.foot{text-align:center;color:rgba(255,255,255,.7);font-size:12px;margin-top:34px;letter-spacing:.08em}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <h1>Тишина</h1>
    <p>спокойное чтение</p>
  </div>
  <div id="daily"></div>
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
  <div class="foot">читай медленно · дыши глубоко</div>
</div>

<div class="reader" id="reader">
  <div class="r-wrap">
    <div class="r-top">
      <button class="r-back" id="rBack">← Назад</button>
      <button class="r-fav" id="rFav">♡</button>
    </div>
    <div class="r-hero" id="rHero"></div>
    <div class="r-body" id="rBody"></div>
    <div class="r-foot"><button class="r-next" id="rNext">Следующая история →</button></div>
  </div>
</div>

<script>
/* ============ ТЕКСТЫ ============ */
const STORIES = [
{
  id:"lake-house", type:"Мини-история", title:"Домик у озера",
  ex:"Утром туман поднимается над водой так медленно, будто ему совсем некуда спешить.",
  moods:["calm"], theme:"lake",
  body:[
  "Домик стоит у самого озера — маленький, с крыльцом, которое скрипит только по утрам. Хозяин просыпается рано, но не потому что надо. Просто в это время озеро самое красивое.",
  "Он выходит на крыльцо с кружкой тёплого чая и смотрит, как туман поднимается над водой. Туман никуда не спешит. Он тянется вверх медленно, лениво, будто у него впереди целый день — а у него и правда впереди целый день.",
  "Где-то далеко кричит птица. Не тревожно — так, для порядка. Вода у берега тихо шлепает о камни: шлёп… шлёп… шлёп. Ритм, который невозможно слушать и при этом думать о делах.",
  "Хозяин допивает чай, ставит кружку на перила и идёт кормить уток. Утки его знают. Они подплывают не спеша, с достоинством, как старые друзья на встречу, о которой договорились сто лет назад.",

},
{
  id:"lighthouse", type:"Мини-история", title:"Сторож маяка",
  ex:"Каждый вечер он поднимается по винтовой лестнице и зажигает свет — для кораблей, которых, может быть, и нет.",
  moods:["sleep"], theme:"sunset",
  body:[
  "Маяк стоит на скале уже сто лет. Его сторож — человек немногословный, с бородой, в которой застрял морской ветер. Каждый вечер, когда солнце начинает клониться к воде, он поднимается по винтовой лестнице — сто двенадцать ступенек, он считал.",
  "Наверху — фонарь. Сторож протирает стекло, проверяет лампу и зажигает свет. Луч медленно поворачивается и уходит в темноту: раз… два… три… Он светит для кораблей, которых, может быть, сегодня нет. Но это неважно. Свет зажигают не для тех, кто есть, а для тех, кто может заблудиться.",

},
{
  id:"rain-letter", type:"Письмо", title:"Письмо о дожде",
  ex:"Дождь стучит по крыше, и вдруг понимаешь: никуда не надо. Можно просто сидеть и слушать.",
  moods:["calm"], theme:"meadow",
  body:[
  "Здравствуй. Пишу тебе, потому что за окном дождь, и мне захотелось с кем-то этим поделиться.",
  "Он начался тихо, почти неслышно — будто кто-то перебирал крупу. А потом разошёлся, и теперь стучит по крыше ровно и уверенно, как человек, который знает своё дело.",

  "Трава после дождя пахнет так, что хочется выйти босиком. Земля становится мягкой и тёмной, листья — блестящими, будто их только что помыли. Весь мир как будто умылся и стал новее.",

  "Когда дождь кончится, выглянет солнце, и всё заблестит. Но пока он идёт — давай просто посидим. Никуда не надо. Слушай."
  ]
},
{
  id:"night-train", type:"Мини-история", title:"Ночной поезд",
  ex:"За окном мелькают огни полустанков, колёса стучат колыбельную, а весь мир остался где-то позади.",
  moods:["sleep"], theme:"night",
  body:[
  "Ночной поезд идёт через темноту мягко и уверенно. Колёса стучат: ту-дук… ту-дук… ту-дук. Это самая лучшая колыбельная на свете — её придумали не люди, а сама дорога.",
  "В купе тепло и пахнет чаем. Проводница разносит стаканы в подстаканниках, и чай в них качается в такт движению. За окном — темнота, а в темноте иногда вспыхивают огни: полустанок, одинокий дом, далёкий город.",

{
  id:"gardener", type:"Притча", title:"Садовник",
  ex:"Он сажал деревья, под которыми никогда не будет сидеть. «Зато будет сидеть кто-то другой», — говорил он.",
  moods:["inspire"], theme:"forest",

  "Однажды сосед, тот самый, что смеялся, пришёл к садовнику и сел рядом на скамейку. Было тихо, пахло яблоками. «Знаешь, — сказал сосед, — я всю жизнь строил дом. Большой, крепкий. А ты строил вот это». Он обвёл рукой сад.",

/* ============ ИЛЛЮСТРАЦИИ (плоские сцены в духе референса) ============ */
function bird(x,y,s,c){
  c=c||"#6b554b";
  return `<path d="M${x},${y} q${s},${-s} ${s*2},0 q${s},${-s} ${s*2},0" stroke="${c}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
}
function pine(x,y,s,c){
  return `<path d="M${x-s/2},${y} L${x},${y-s} L${x+s/2},${y} Z" fill="${c}"/><rect x="${x-1.5}" y="${y}" width="3" height="${s*0.28}" fill="${c}"/>`;
}
function stars(n,seed){
  let s="";
  for(let i=0;i<n;i++){
    const x=(seed*97+i*53)%300, y=(seed*31+i*37)%110;
    s+=`<circle cx="${x}" cy="${y}" r="${1+(i%3)*0.5}" fill="#fff" opacity="${0.35+(i%4)*0.15}"/>`;
  }
  return s;
}

function scene(theme){ return (SCENES[theme]||SCENES.lake)(); }

/* ============ МЕХАНИКА ============ */
const $=id=>document.getElementById(id);
let favs=[]; try{ favs=JSON.parse(localStorage.getItem("tishina.favs")||"[]"); }catch(e){}
let mood="all", currentId=null;

function saveFavs(){ localStorage.setItem("tishina.favs", JSON.stringify(favs)); }
function minutes(s){ const w=s.body.join(" ").split(/\s+/).length; return Math.max(2, Math.round(w/130)); }
function toggleFav(id){
  favs = favs.includes(id) ? favs.filter(f=>f!==id) : [...favs, id];
  saveFavs(); render(); if(currentId) syncReaderFav();
}
function filtered(){
  let list=[...STORIES];
  if(mood==="fav") list=list.filter(s=>favs.includes(s.id));
  else if(mood!=="all") list=list.filter(s=>s.moods.includes(mood));
  return list;
}
function cardHTML(s){
  const liked=favs.includes(s.id)?" liked":"";
  return `<article class="card" data-open="${s.id}">
    <button class="fav${liked}" data-fav="${s.id}">${favs.includes(s.id)?"♥":"♡"}</button>
    <div class="kicker">${s.type} · ${minutes(s)} мин</div>
    <h3>${s.title}</h3>
    <p class="ex">${s.ex}</p>
    <div class="art">${scene(s.theme)}</div>
    <button class="pill" data-open="${s.id}">Читать</button>
  </article>`;
}
function render(){
  // чипы
  $("chips").innerHTML = MOODS.map(m=>
    `<button class="chip${m.id===mood?" on":""}" data-mood="${m.id}">${m.label}</button>`).join("");
  // история дня
  const day=Math.floor(Date.now()/864e5);
  const d=STORIES[day%STORIES.length];
  $("daily").innerHTML=`<div class="daily" data-open="${d.id}">
    <div class="d-art">${scene(d.theme)}</div>
    <div class="d-body"><div class="d-tag">☀ история дня</div><h2>${d.title}</h2><p class="d-ex">${d.ex}</p></div>
  </div>`;
  // сетка
  const list=filtered();
  $("grid").innerHTML = list.length ? list.map(cardHTML).join("")
    : `<div class="empty">Тут пока пусто.<br>Нажми ♡ на карточке, чтобы добавить в избранное.</div>`;
}
function openReader(id){
  const s=STORIES.find(x=>x.id===id); if(!s) return;
  currentId=id;
  $("rHero").innerHTML=scene(s.theme);
  $("rBody").innerHTML=`<span class="kicker">${s.type} · ${minutes(s)} мин чтения</span>
    <h2>${s.title}</h2><p class="r-sub">${s.ex}</p>`+
    s.body.map(p=>`<p>${p}</p>`).join("");
  syncReaderFav();
  $("reader").classList.add("open");
  $("reader").scrollTop=0;
  document.body.style.overflow="hidden";
}
function syncReaderFav(){
  const b=$("rFav");
  b.textContent=favs.includes(currentId)?"♥":"♡";
  b.classList.toggle("liked", favs.includes(currentId));
}
function closeReader(){ $("reader").classList.remove("open"); document.body.style.overflow=""; currentId=null; }

document.addEventListener("click",e=>{
  const fav=e.target.closest("[data-fav]");
  if(fav){ e.stopPropagation(); toggleFav(fav.dataset.fav); return; }
  const moodBtn=e.target.closest("[data-mood]");
  if(moodBtn){ mood=moodBtn.dataset.mood; render(); return; }
  const open=e.target.closest("[data-open]");
  if(open){ openReader(open.dataset.open); return; }
});
$("rBack").onclick=closeReader;
$("rFav").onclick=()=>{ if(currentId) toggleFav(currentId); };
$("rNext").onclick=()=>{
  const list=filtered().length?filtered():STORIES;
  const i=list.findIndex(s=>s.id===currentId);
  openReader(list[(i+1)%list.length].id);
};
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeReader(); });

render();
// диплинк ?read=<id> — удобно делиться историей
const q=new URLSearchParams(location.search).get("read");
if(q && STORIES.some(s=>s.id===q)) openReader(q);
</script>
