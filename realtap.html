window.Shelf = {
  open: async () => {}, put: async (x) => x,
  all: async () => [], get: async () => {"id":"miz","title":"Мизери","authors":["Стивен Кинг"],"format":"fb2","fileName":"m.fb2","cover":null,"toc":[{"label":"Глава 1","chapter":0},{"label":"Часть первая Энни","chapter":1},{"label":"Часть вторая Мизери","chapter":2}],"chapters":[{"label":"Часть четвертая Богиня","html":"\u003ch3>\n    Часть четвертая\n    Богиня\n   \u003c/h3>\u003cblockquote>\u003cp>–&nbsp;Придет к тебе высокая темная незнакомка,&nbsp;– сообщила цыганка, и Мизери одновременно поняла две вещи: перед ней не цыганка и в палатке они уже не одни. Она почувствовала запах духов Гвендолен Честейн, а потом руки сумасшедшей женщины сомкнулись на ее горле.\u003c/p>\u003cp>–&nbsp;Я думаю,&nbsp;– сказала цыганка, которая не была цыганкой,&nbsp;– я думаю, она уже здесь.\u003c/p>\u003cp>Мизери хотела закричать, но не смогла набрать воздуха в грудь.\u003c/p>\u003cp style=\"text-align: right;\">\u003cem>«Сын Мизери»\u003c/em>\u003c/p>\u003c/blockquote>\u003cblockquote>\u003cp>–&nbsp;Так всегда кажется, босс Йен,&nbsp;– сказал Езекия.&nbsp;– Откуда ни гляди, она вроде как глядит на тебя. Не знаю, правда, нет, но только бурка говорят, если даже сзади подойдешь, она вроде глядит на тебя.\u003c/p>\u003cp>–&nbsp;Но она же каменная,&nbsp;– возразил Йен.\u003c/p>\u003cp>–&nbsp;Ну да, босс Йен,&nbsp;– кивнул Езекия.&nbsp;– Отсюда ее сила.\u003c/p>\u003cp style=\"text-align: right;\">\u003cem>«Возвращение Мизери»\u003c/em>\u003c/p>\u003c/blockquote>\u003ch3>\n     1\n    \u003c/h3>\u003cp>\u003cem>коричневый ухмнннн\u003c/em>\u003c/p>\u003cp>\u003cem>йерннн коричневый ухмнннн\u003c/em>\u003c/p>\u003cp>\u003cem>фэйунннн\u003c/em>\u003c/p>\u003cp>Вот такие звуки: даже в дымке.\u003c/p>\u003ch3>\n     2\n    \u003c/h3>\u003cp>\u003cem>Теперь надо прополоскать,\u003c/em> сказала она, и вот что из этого получается:\u003c/p>\u003ch3>\n     3\n    \u003c/h3>\u003cp>Прошло девять месяцев с тех пор, как Уикс и Макнайт вынесли Пола Шелдона из дома Энни на носилках. Теперь он часть времени проводил в больнице в Куинсе\u003ca class=\"fn\" data-fn=\"n_44\">[44]\u003c/a>, а часть – в своей новой квартире на восточном берегу Манхэттена. Доктора заново переломали неправильно сраставшиеся кости. Левая нога ниже колена все еще оставалась в гипсе. Врачи сказали: ему суждено прихрамывать всю оставшуюся жизнь, но ходить он \u003cem>будет,\u003c/em> и вполне вероятно, что ходьба будет безболезненной. Если бы он сохранил ступню, то, вероятно, хромал бы сильнее, и ходьба потребовала бы от него больших усилий. По иронии судьбы Энни оказала ему услугу.\u003c/p>\u003cp>Он очень много пил и ничего не писал. Ему снились дурные сны.\u003c/p>\u003cp>Выходя майским днем из лифта на девятом этаже, он в порядке исключения думал не об Энни Уилкс, а об увесистой пачке, которую держал под мышкой. Гранки «Возвращения Мизери». Его издатели торопились с публикацией нового романа – и неудивительно, если принять во внимание заголовки газетных статей, рисующих обстоятельства, при которых этот роман создавался. Беспрецедентный случай: «Хастинг хаус» заказал первый тираж в миллион экземпляров. «И это только начало,&nbsp;– говорил Полу за обедом в тот день его редактор Чарли Меррилл.&nbsp;– Друг мой, эта книга побьет мировой рекорд продаж. Мы все должны на коленях молить Бога о том, чтобы книга получилась хоть почти так же хороша, как история, стоящая за этой книгой».\u003c/p>\u003cp>Пол не знал, так ли хороша книга, и ему в общем-то не было до этого дела. Ему хотелось только, чтобы эта книга осталась позади, хотелось найти \u003cem>следующую\u003c/em> свою книгу… Но бесплодные дни превращались в бесплодные недели, а потом в бесплодные месяцы, и он уже начинал сомневаться, что следующая книга \u003cem>будет.\u003c/em>\u003c/p>\u003cp>Чарли уговаривал его написать хронику ниспосланных ему испытаний. Успех такой книги, говорил Чарли, превзойдет успех «Возвращения Мизери». По тиражам такая книга превзойдет Якокку\u003ca class=\"fn\" data-fn=\"n_45\">[45]\u003c/a>. Когда Пол – из праздного любопытства – спросил Чарли, сколько могли бы стоить права на издание в мягкой обложке, Чарли отбросил со лба длинную челку, зажег сигарету «Кэмел» и сказал: «Думаю, мы могли бы продать эту \u003cem>хренотень\u003c/em> с аукциона и танцевать от десяти миллионов долларов». Говоря это, Чарли даже не прикрыл один глаз. Через несколько секунд Пол понял, что Чарли говорит серьезно или по крайней мере в это верит.\u003c/p>\u003cp>Но он не в состоянии написать такую книгу. Сейчас он не может, а возможно, не сможет никогда. Его работа – писать романы. Может, он и мог бы выполнить заказ Чарли, но это означало бы, что он навсегда отказывается от возможности написать новый роман.\u003c/p>\u003cp>\u003cem>Как ни смешно, получится именно роман,\u003c/em> подумал он и едва не сказал об этом Чарли Мерриллу… однако в последний момент удержался. Как ни смешно, Чарли нет до этого дела.\u003c/p>\u003cp>\u003cem>Начнется он как невыдуманная история, а потом я начну подправлять то, что было… сначала чуть-чуть… потом еще чуть-чуть… потом еще чуть-чуть… Не для того, чтобы я сам выглядел лучше (хотя скорее всего я об этом позабочусь), и не для того, чтобы Энни выглядела хуже (это невозможно). Просто для того, чтобы придать роману пресловутую литературную завершенность. Я не хочу превращаться в выдуманный персонаж. Может быть, писательство – это мастурбация, но Боже сохрани от превращения писательства в самоедство.\u003c/em>\u003c/p>\u003cp>Он жил в квартире 9-Е, самой дальней от лифта, а сегодня ему показалось, что до двери предстоит идти мили две. Он обреченно двинулся вперед, опираясь обеими руками на палки. \u003cem>Клак… клак… клак… клак…\u003c/em> Боже, до чего отвратительный звук.\u003c/p>\u003cp>Тупая боль в ногах. Очень нужен новрил. Иногда он подумывал о том, что ему хочется вернуться к Энни просто затем, чтобы получить лекарство. Врачи запретили ему наркотические препараты. Отчасти их заменяла выпивка, и теперь, когда он доберется до своей квартиры, то примет двойную порцию бурбона.\u003c/p>\u003cp>А потом какое-то время будет пялиться в пустой экран компьютера. Отлично проведет время. Пресс-папье Пола Шелдона, купленное за пятнадцать тысяч долларов.\u003c/p>\u003cp>\u003cem>Клак… клак… клак… клак…\u003c/em>\u003c/p>\u003cp>Теперь надо достать из кармана ключ и не выронить при этом зажатую под мышкой пачку гранок, завернутых в оберточную бумагу. Он прислонил обе палки к стене. Пачка выскользнула у него из-под мышки и упала на коврик возле двери.\u003c/p>\u003cp>Он выругался, и обе палки тоже упали на пол. Для полного счастья.\u003c/p>\u003cp>Пол стоял, покачиваясь на искалеченных зудящих ногах, и спрашивал себя, сойдет ли он с ума или заплачет. Не хотелось бы плакать здесь, в коридоре, но не исключено, что он все-таки расплачется. Он заплакал. У него постоянно болят ноги, и ему нужно его лекарство, а не аспирин, которым его пичкали в больнице и от которого только тяжелеет голова. Ему нужно \u003cem>хорошее\u003c/em> лекарство, такое, какое давала ему Энни. И еще – он постоянно измучен. Разве эти дерьмовые палки нужны ему, чтобы твердо стоять на ногах? Нет, ему нужны сюжеты, нужна работа фантазии. Вот настоящее безотказное лекарство, но оно куда-то испарилось. Похоже, закончилось время игры.\u003c/p>\u003cp>\u003cem>Вот что следует за окончанием романа,\u003c/em> думал он, открывая дверь и входя в прихожую. \u003cem>Никто никогда об этом не пишет. Потому что это – сплошная тоска. Она должна была умереть, когда я натолкал ей в глотку бумаги, и я тоже должен был умереть. По крайней мере в тот момент мы были персонажами ее любимых сериалов – никаких полутонов, только белое и черное, добро и зло. Я был Джеффри, а она – Богиня Пчел Бурка. Да-да, развязка и все такое, но это же смешно. Пусть все это тут валяется, плевать. Сначала выпью, потом подберу. Сначала буду Непослушным Парнем, а потом…\u003c/em>\u003c/p>\u003cp>Мысли его прервались. Он заметил, что в квартире слишком темно. И еще – запах. Ему знаком этот запах, убийственная смесь грязи и пудры.\u003c/p>\u003cp>Энни в униформе медицинской сестры и шапочке белым привидением поднялась из-за спинки дивана. В руке у нее был топор, и она закричала: \u003cem>Прополоскать, Пол! Пора прополоскать!\u003c/em>\u003c/p>\u003cp>Он завопил, хотел развернуться, но больные ноги не слушались. Мощным прыжком она перемахнула диван. Накрахмаленная униформа зашуршала. В первый раз топор только рассек воздух у Пола за спиной – так он подумал, а потом рухнул на ковер, вдыхая запах собственной крови. И увидел, что топор почти рассек его пополам.\u003c/p>\u003cp>–&nbsp;\u003cem>Прополоскать!\u003c/em>&nbsp;– крикнула она, и кисть его правой руки полетела прочь.\u003c/p>\u003cp>–&nbsp;\u003cem>Прополоскать!\u003c/em>&nbsp;– И левая кисть отлетела; опираясь на обрубленные запястья, он пополз к входной двери, выглянул в коридор, и – невероятно, но факт!&nbsp;– гранки все еще лежали там, те самые гранки, что вручил ему Чарли после обеда у мистера Ли, и шелковым блеском отливала обертка, а сверху доносилась музыка.\u003c/p>\u003cp>\u003cem>Энни, ты теперь можешь ее прочитать!\u003c/em>&nbsp;– хотел крикнуть он, но успел выговорить только Энни ты, а потом голова его отделилась от туловища и покатилась к стене. Последнее, что он увидел как сквозь туман, было его собственное застывшее тело и белые тапочки Энни.\u003c/p>\u003cp>\u003cem>Богиня,\u003c/em> подумал он и умер.\u003c/p>\u003ch3>\n     4\n    \u003c/h3>\u003cp>\u003cem>Сценарий:\u003c/em> Изложение сюжета. Сюжетная схема.\u003c/p>\u003cp>Словарь Уэбстера\u003ca class=\"fn\" data-fn=\"n_46\">[46]\u003c/a>\u003c/p>\u003cbr>\u003cp>\u003cem>Автор:\u003c/em> Создатель произведения.\u003c/p>\u003cp>Словарь Уэбстера\u003c/p>\u003cp>\u003cem>Вымысел:\u003c/em> Описанные в произведении события, не имевшие места в действительности.\u003c/p>\u003cp>Словарь Уэбстера\u003c/p>\u003ch3>\n     5\n    \u003c/h3>\u003cp>Поли, Ты Можешь?\u003c/p>\u003ch3>\n     6\n    \u003c/h3>\u003cp>Да; конечно, он может. «В \u003cem>авторском сценарии\u003c/em> Энни осталась в живых, хотя он и понимал, что это из области \u003cem>вымысла».\u003c/em>\u003c/p>\u003ch3>\n     7\n    \u003c/h3>\u003cp>Он действительно обедал с Чарли Мерриллом. У них действительно состоялся разговор. Но когда он вернулся домой, то сразу понял, что шторы в квартире задернула приходящая уборщица, и хотя он упал и закричал от страха, когда Энни, подобно Каину, поднялась из-за спинки дивана, на самом деле он увидел всего лишь кота, сиамского кота с раскосыми глазами по кличке Дампстер, которого приобрел в кошачьем питомнике в прошлом месяце.\u003c/p>\u003cp>Энни не явилась в его квартиру, потому что вовсе не была богиней, она была просто сумасшедшей женщиной, которая мучила Пола, повинуясь своим прихотям. Энни сумела извлечь изо рта и из дыхательного горла почти всю бумагу и выбраться из окна спальни Пола, пока Пол спал наркотическим сном в ванной комнате. Она доползла до сарая, и там ей пришел конец. Когда Уикс и Макнайт нашли ее, она была мертва, но умерла она не от удушья. Она умерла оттого, что проломила себе череп при падении. Так что в некотором смысле убила ее та самая пишущая машинка, которую Пол так люто ненавидел.\u003c/p>\u003cp>Но, что и говорить, у нее имелись свои планы. На этот раз она не удовлетворилась даже топором.\u003c/p>\u003cp>Они обнаружили ее лежащей возле стойла свиньи, именуемой Мизери, и пальцы ее сжимали ручку цепной пилы.\u003c/p>\u003cp>Впрочем, все это осталось в прошлом. Энни Уилкс в могиле. Но не лежится ей там спокойно, как и Мизери Честейн.\u003c/p>\u003cp>В снах, да и наяву, Пол вновь и вновь вызывал ее. Богиню убить нельзя. Можно, наверное, отгородиться от нее на время бурбоном, но и только.\u003c/p>\u003cp>Он подошел к бару, взглянул на бутылку, потом посмотрел в коридор, где лежали на полу гранки и костыли. Бросив прощальный взгляд на бутылку, он заковылял обратно в коридор.\u003c/p>\u003ch3>\n     8\n    \u003c/h3>\u003cp>\u003cem>Прополоскать.\u003c/em>\u003c/p>\u003ch3>\n     9\n    \u003c/h3>\u003cp>Полчаса спустя он сидел перед пустым дисплеем компьютера и думал о наказании, которого заслуживает. Вместо алкоголя он принял аспирин, но знал, что еще пятнадцать минут или, быть может, полчаса будет таращиться на мигающий на темном экране курсор, а потом пойдет и все-таки выпьет.\u003c/p>\u003cp>Правда…\u003c/p>\u003cp>Правда, возвращаясь домой после обеда с Чарли, он увидел на улице нечто примечательное, и у него родилась идея. Небольшая. Маленькая такая идея. В общем-то совершенно незначительная встреча. На 48-й улице ему навстречу попался мальчик, толкающий перед собой тележку, вроде тех, что бывают в супермаркетах, но в тележке стояла клетка, а в ней находилось довольно крупное пушистое животное, которое Пол сначала принял за кота. Присмотревшись, он заметил на спине кота широкую белую полосу.\u003c/p>\u003cp>–&nbsp;Сынок,&nbsp;– спросил он,&nbsp;– это у тебя скунс?\u003c/p>\u003cp>–&nbsp;Да,&nbsp;– ответил парнишка и чуть прибавил шаг. На городских улицах не рекомендуется вступать в пространные беседы с незнакомцами, в особенности с незнакомцами мрачного вида, у которых под мышками какие-то пачки размером со средний чемодан и которые ковыляют, опираясь на две металлические клюки. Мальчишка скрылся за углом.\u003c/p>\u003cp>Полу очень хотелось поймать такси, но ему было велено за день проходить пешком не меньше мили, и он должен пройти свою милю, а ноги болят немилосердно, и чтобы не думать об этой миле, он начал гадать, откуда идет этот мальчик, где он взял тележку, а главное – где раздобыл скунса.\u003c/p>\u003cp>За спиной послышался какой-то шум, и он обернулся, готовясь увидеть Энни с цепной пилой в руке, Энни в красной фланелевой блузе и в джинсах.\u003c/p>\u003cp>Он зажмурил глаза, открыл их, увидел привычную пустоту и вдруг разозлился. Тогда он повернулся к компьютеру и начал писать, изо всех сил лупя по клавишам.\u003c/p>\u003ch3>\u003ccode>–&nbsp;1 —\u003c/code>\u003c/h3>\u003cp>\u003ccode>В доме что-то копошилось, и мальчик сразу подумал о крысах, но все-таки свернул за угол; домой идти было рано, так как уроки в школе закончатся только через полтора часа, а он сегодня решил прогулять школу.\u003c/code>\u003c/p>\u003cp>\u003ccode>Возле стены он действительно рассмотрел при свете солнца изогнутую спину животного, но то была не крыса, а большой черный кот с таким пушистым хвостом, какого мальчику еще не доводилось видеть.\u003c/code>\u003c/p>\u003ch3>\n     10\n    \u003c/h3>\u003cp>Пол остановился. Сердце внезапно забилось сильнее. \u003cem>Поли, Ты Можешь?\u003c/em>\u003c/p>\u003cp>Он не смел отвечать на этот вопрос. Снова склонился над клавиатурой и после короткой паузы застучал по клавишам… теперь уже не с такой силой.\u003c/p>\u003ch3>\n     11\n    \u003c/h3>\u003cp>\u003ccode>Это был \u003cstrong>не\u003c/strong> кот. Эдди Десмонд всю жизнь жил в Нью-Йорке, но в зоопарке в Бронксе он бывал, а кроме того, елки-палки, на свете есть книжки с картинками, не так ли? Поэтому он знал, что это за животное, хотя не имел ни малейшего представления, как оно очутилось в сдающемся внаем доме на 105-й улице. Идущая вдоль спины белая полоса не оставляла места для сомнений. Это был скунс.\u003c/code>\u003c/p>\u003cp>\u003ccode>Эдди медленно двинулся к нему. Его ноги утопали в пыли\u003c/code>\u003c/p>\u003ch3>\n     12\n    \u003c/h3>\u003cp>Он может. Он \u003cem>может.\u003c/em>\u003c/p>\u003cp>Может, подумал он с благодарностью и страхом. Дверь перед ним открылась, и он смотрел теперь на то, что за ней происходило, не замечая, что пальцы все быстрее стучат по клавишам, не замечая, что больные ноги находятся в этом же городе, в пятидесяти кварталах от места действия, не замечая, что он пишет и плачет.\u003c/p>\u003cblockquote>\u003cp style=\"text-align: right;\">\u003cem>Ловелл, штат Мэн, 23 сентября 1984 —\u003c/em>\u003c/p>\u003cp style=\"text-align: right;\">\u003cem>Бангор, штат Мэн, 7 октября 1986.\u003c/em>\u003c/p>\u003cp style=\"text-align: right;\">\u003cem>Вот и окончен мой\u003cem> рассказ.\u003c/em>\u003c/em>\u003c/p>\u003c/blockquote>"}],"notes":{"n_1":"1 Хаггард Генри Райдер (1856–1925) – английский писатель. Действие многих его романов происходит в экзотических странах. – Здесь и далее примеч. пер.","n_2":"2 В американских аптеках, помимо лекарств, часто продается разнообразная печатная продукция.","n_3":"3 Сангре-де-Кристо – горный массив на территории штата Колорадо.","n_4":"4 Лос-Анджелес.","n_5":"5 Роман английского писателя Томаса Гарди (1840–1928).","n_6":"6 Роман Уильяма Фолкнера (1897–1962).","n_7":"7 Согласно германским поверьям, Песочный человек приходит к детям по вечерам и сыплет им в глаза песок, отчего они засыпают. Этот образ переосмыслен в сказке Э.Т.А. Гофмана «Песочный человек».","n_8":"8 В США разрушительные ураганы принято называть женскими именами.","n_9":"9 Rara avis – буквально: редкая птица (лат.). Употребляется в значении: уникум, редкостный экземпляр, нечто необычное.","n_10":"10 Викторианская эпоха – правление английской королевы Виктории – длилась с 1837-го по 1901 г. В эту эпоху создавали свои произведения выдающиеся английские романисты, в частности, Ч. Диккенс.","n_11":"11 Около семи градусов тепла по шкале Цельсия.","n_12":"12 Уэбстер Даниэль (1782–1852) – юрист, государственный и политический деятель. Славился своим красноречием; до сих пор считается крупнейшим оратором в истории США. – Примеч. ред.","n_13":"13 Дезинфицирующее средство с феноловыми добавками.","n_14":"14 Кодеин – сильный транквилизатор, обладающий наркотическими свойствами.","n_15":"15 Вольный пересказ парадокса, изложенного Л. Кэрроллом в сказке «Алиса в Зазеркалье».","n_16":"16 Таймс-сквер – площадь в Нью-Йорке.","n_17":"17 Шерстяная материя.","n_18":"18 День жатвы отмечался в старой Англии 1 августа.","n_19":"19 Вельд – южноафриканская степь.","n_20":"20 Моэм Уильям Сомерсет (1874–1965) – знаменитый английский писатель.","n_21":"21 Фаулз Джон (р. 1926) – английский писатель. Его первый роман – «Коллекционер».","n_22":"22 Oeuvre – здесь: собрание сочинений (фр.).","n_23":"23 Около восемнадцати градусов Цельсия.","n_24":"24 Пильтдаунским человеком назвали найденного в Англии близ Пильтдауна необычайно уродливого доисторического человека. Впоследствии оказалось, что эта находка была фальсификацией.","n_25":"25 Бедлам – лондонская психиатрическая больница.","n_26":"26 Вордсворт Уильям (1770–1850) – английский поэт-романтик.","n_27":"27 Сборник сказок американского писателя Джоэля Харриса (1848–1908).","n_28":"28 Гринвич-Виллидж – район Нью-Йорка.","n_29":"29 Сверхъестественные события в отеле «Оверлук» описаны в романе С. Кинга «Сияние».","n_30":"30 Савлу, впоследствии Павлу, на пути в Дамаск явился Христос (см. Деяния апостолов, гл. 9).","n_31":"31 Мауи – один из Гавайских островов.","n_32":"32 Луау – традиционный на Гавайях пир на открытом воздухе; так же называется одно из блюд местной кухни.","n_33":"33 Пер. Ал. Михеева.","n_34":"34 Милль Сесиль Блаунт де (1881–1959) – американский кинорежиссер.","n_35":"35 В быстром темпе (ит.).","n_36":"36 «Мир глазами Гарпа» – роман американского писателя Джона Ирвинга (р. 1942).","n_37":"37 Голдинг Уильям (1911–1993) – известный английский писатель.","n_38":"38 Имеются в виду опыты академика Ивана Петровича Павлова (1849–1936) по выработке условных рефлексов у животных.","n_39":"39 Грязный Гарри – герой популярных американских боевиков, бывший полицейский, воюющий с преступниками на свой страх и риск.","n_40":"40 «Война миров» – роман английского писателя-фантаста Герберта Джорджа Уэллса (1866–1946).","n_41":"41 Норман Мейлер (р. 1923) и Джон Чивер (р. 1912) – выдающиеся американские писатели.","n_42":"42 Чучело Гая Фокса, участника так называемого «порохового заговора», ежегодно сжигалось на улицах английских городов во время народных гуляний 5 ноября.","n_43":"43 В греческой мифологии жена царя Фив. Чтобы наказать Ниобу за ее гордыню, Аполлон и Артемида убили семерых ее сыновей и семь дочерей, после чего сама Ниоба обратилась в каменную статую.","n_44":"44 Район Нью-Йорка.","n_45":"45 Книга американского предпринимателя, крупного специалиста в области маркетинга Ли Якокки «Карьера менеджера» («Якокка: автобиография», 1984) долгое время была чрезвычайно популярна в мире.","n_46":"46 Словарь Уэбстера (Webster’s Dictionary) – общепринятое название словаря, созданного видным американским лексикографом, реформатором орфографии американского варианта английского языка Ноа Уэбстером и впервые изданного в 1828 г."},"progress":0,"addedAt":1791733105017,"lastOpened":1791733105017},

<style>
@font-face{font-family:'Tishina Times';src:url('fonts/times.ttf') format('truetype');font-display:swap}
:root{
  --ink:#1c1c1e; --muted:#8e8e93; --line:#e9e9ee; --bg:#ffffff; --bg2:#f6f6f8;
  --accent:#c65b4e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Manrope',-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--ink);
  min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:0 20px}

/* шапка */
.top{display:flex;align-items:center;justify-content:space-between;padding:26px 0 6px}
.top h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:36px;margin:0;letter-spacing:-.01em}
.add-btn{width:40px;height:40px;border-radius:50%;border:none;background:var(--ink);color:#fff;
  font-size:24px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.add-btn:active{transform:scale(.92)}

/* текущая книга */
.now-card{display:flex;gap:18px;padding:18px 0 8px;align-items:center}
.now-card .cover{width:118px;border-radius:8px;box-shadow:0 10px 26px rgba(0,0,0,.22)}
.now-info{flex:1;min-width:0}
.now-info .t{font-size:19px;font-weight:800;margin:0 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now-info .a{font-size:14px;color:var(--muted);margin:0 0 12px}
.pbar{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:8px}
.pbar i{display:block;height:100%;background:var(--ink);border-radius:99px}
.pct{font-size:13px;color:var(--muted);font-weight:600}
.read-btn{margin-top:12px;border:none;background:var(--ink);color:#fff;font-family:inherit;font-weight:700;
  font-size:14px;padding:11px 26px;border-radius:999px;cursor:pointer}
.read-btn:active{transform:scale(.96)}

/* секция */
.sec{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);
  margin:26px 0 14px}

/* недавние */
.recent{display:flex;gap:16px;overflow-x:auto;padding:2px 20px 8px;margin:0 -20px;scrollbar-width:none}
.recent::-webkit-scrollbar{display:none}
.rec{flex:0 0 104px;cursor:pointer}
.rec .cover{width:104px;height:150px;object-fit:cover;border-radius:6px;box-shadow:0 6px 16px rgba(0,0,0,.18);background:var(--bg2)}
.rec .rt{font-size:12px;font-weight:700;margin:8px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .rp{font-size:11px;color:var(--muted);font-weight:600}

/* библиотека */
.lib-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 14px;padding-top:6px}
.book{cursor:pointer}
.book .cover{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:6px;box-shadow:0 6px 16px rgba(0,0,0,.16);background:var(--bg2)}
.book .bt{font-size:12.5px;font-weight:700;margin:8px 0 2px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.book .ba{font-size:11.5px;color:var(--muted)}

.cover-ph{display:flex;align-items:center;justify-content:center;background:linear-gradient(150deg,#d99a7c,#8a5f4d);
  color:#fff;font-family:'Cormorant Garamond',serif;font-style:italic;text-align:center;padding:10px;font-size:15px}
.rec .cover-ph,.book .cover-ph,.now-card .cover-ph{background:linear-gradient(150deg,#d99a7c,#8a5f4d)}

/* пусто */
.empty{text-align:center;padding:70px 20px;color:var(--muted)}
.empty .big{font-size:52px;margin-bottom:12px}
.empty p{font-size:15px;line-height:1.55;margin:0 0 20px}

/* таб-бар */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.88);backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);z-index:40;
  padding-bottom:env(safe-area-inset-bottom)}
.tabs{max-width:560px;margin:0 auto;display:flex}
.tab{flex:1;border:none;background:none;cursor:pointer;padding:10px 0 12px;display:flex;flex-direction:column;
  align-items:center;gap:3px;color:var(--muted);font-family:inherit;font-size:10.5px;font-weight:700}
.tab svg{width:25px;height:25px}
.tab.on{color:var(--ink)}

/* детали книги */
.detail{position:fixed;inset:0;background:var(--bg);z-index:50;overflow-y:auto;transform:translateY(100%);transition:transform .3s ease}
.detail.open{transform:translateY(0)}
.d-hero{position:relative;overflow:hidden;padding:calc(12px + env(safe-area-inset-top)) 16px 0}
.d-hero-bg{position:absolute;inset:-30px;background-size:cover;background-position:center;
  filter:blur(30px) saturate(1.5);opacity:.6;transform:scale(1.15)}
.d-hero-bg.ph{background:linear-gradient(135deg,#3a3a3f,#6b6b72)}
.d-nav{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center}
.d-navbtn{border:none;width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer;
  background:rgba(255,255,255,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  color:#1c1c1e;font-family:inherit;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.d-cover{position:relative;z-index:1;width:186px;margin:14px auto 0}
.d-cover .cover{width:100%;border-radius:14px;box-shadow:0 18px 44px rgba(0,0,0,.35);display:block}
.d-cover .cover-ph{width:100%;aspect-ratio:2/3;border-radius:14px;background:linear-gradient(135deg,#3a3a3f,#6b6b72);
  color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;
  font-size:20px;padding:18px;text-align:center;box-shadow:0 18px 44px rgba(0,0,0,.35)}
.d-body{position:relative;background:var(--bg);border-radius:30px 30px 0 0;margin-top:-30px;
  padding:30px 22px 70px;max-width:560px;margin-left:auto;margin-right:auto}
.d-body h2{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:30px;margin:0 0 4px;line-height:1.15;text-align:center}
.d-body .da{color:var(--muted);font-size:15px;margin:0 0 18px;text-align:center}
.d-read{display:block;width:100%;padding:16px;font-size:17px;border-radius:999px;margin:0 0 16px;
  background:var(--accent);color:#fff;border:none;font-family:inherit;font-weight:800;cursor:pointer}
.d-read:active{transform:scale(.98)}
.d-prog{display:flex;align-items:center;justify-content:space-between;gap:14px;
  background:var(--bg2);border-radius:20px;padding:16px 18px;margin:0 0 6px}
.d-prog-t{font-weight:800;font-size:16px;margin-bottom:3px}
.d-prog-s{color:var(--muted);font-size:13.5px}
.ring{position:relative;width:64px;height:64px;flex:0 0 auto}
.ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5;stroke-linecap:round}
.ring .ring-bg{stroke:#e4e4e9}
.ring .ring-fg{stroke:var(--accent);stroke-dasharray:119.4;stroke-dashoffset:119.4}
.ring span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:800;color:var(--accent)}
.d-sec{margin-top:22px}
.d-sec-t{font-weight:800;font-size:19px;margin-bottom:10px}
.d-desc{color:#55555c;font-size:15px;line-height:1.6;margin:0;text-align:justify}
.d-toc{border-top:1px solid var(--line)}
.d-toc .row{display:flex;justify-content:space-between;align-items:center;padding:13px 2px;border-bottom:1px solid var(--line);
  font-size:15px;cursor:pointer}
.d-toc .row span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-right:12px}
.d-toc .row .n{color:var(--muted);font-size:13px;flex:0 0 auto}
.d-del{display:block;width:100%;border:none;background:none;color:#d33;font-family:inherit;
  font-size:15px;font-weight:700;cursor:pointer;margin-top:26px;padding:12px}

/* тост */
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:rgba(28,28,30,.92);color:#fff;font-size:14px;font-weight:600;padding:12px 22px;border-radius:999px;
  opacity:0;transition:.25s;z-index:80;pointer-events:none;max-width:86vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hidden{display:none!important}

/* ридер */
.reader{--rbg:#ffffff;--rink:#1c1c1e;--rmuted:#8e8e93;--rline:#e9e9ee;--rbar:rgba(255,255,255,.94);--rbgimg:none;
  position:fixed;inset:0;background-color:var(--rbg);background-image:var(--rbgimg);color:var(--rink);z-index:70;display:flex;flex-direction:column;
  transform:translateY(102%);transition:transform .3s ease}
.reader[data-bg="cream"]{--rbg:#f3f0e4;--rink:#2c2620;--rmuted:#8a7d68;--rline:#e0d4b8;--rbgimg:url('bg/cream.png')}
.reader[data-bg="sepia"]{--rbg:#f3e9d2;--rink:#43382b;--rmuted:#8a7a5f;--rline:#e0d2b2;--rbgimg:none}
.reader[data-bg="blue"]{--rbg:#98babc;--rink:#1f2a30;--rmuted:#54696f;--rline:#86a3a8;--rbgimg:url('bg/blue.png')}
.reader[data-bg="sand"]{--rbg:#dcc2a1;--rink:#33291c;--rmuted:#77644c;--rline:#c6a67f;--rbgimg:url('bg/sand.png')}
.reader[data-bg="night"]{--rbg:#17171a;--rink:#e8e3d8;--rmuted:#98989d;--rline:#2c2c31;--rbgimg:none}
.reader.open{transform:none}
.r-top{position:absolute;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;z-index:5;
  display:flex;align-items:center;gap:12px;padding:10px 14px;
  background:rgba(255,255,255,.97);border-radius:22px;
  box-shadow:0 10px 30px rgba(0,0,0,.18);
  transition:transform .28s ease,opacity .28s ease}
.r-top.gone{transform:translateY(-140%);opacity:0;pointer-events:none}
.r-back{border:none;background:#ececf0;width:38px;height:38px;border-radius:50%;font-size:17px;cursor:pointer;color:#1c1c1e;flex:0 0 auto}
/* верх/низ всегда белые — текст в них тоже фиксированный тёмный */
.r-top,.r-bottom{--rink:#1c1c1e;--rmuted:#8e8e93;--rline:#e9e9ee}
.r-title{flex:1;min-width:0;font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-aa{border:none;background:none;font-size:21px;font-weight:600;cursor:pointer;color:var(--rink);padding:6px 8px;flex:0 0 auto;font-family:inherit}
.r-pct{font-size:13px;color:var(--rmuted);font-weight:700;flex:0 0 auto}
.r-content{flex:1;overflow:hidden;position:relative;cursor:pointer;
  padding:calc(20px + env(safe-area-inset-top)) 24px calc(20px + env(safe-area-inset-bottom))}
.r-pages{height:100%;column-fill:auto;-webkit-column-fill:auto;overflow:hidden;font-size:var(--rfs,18.5px)}
.r-pages p{font-family:Georgia,'Times New Roman',serif;font-size:1em;line-height:1.68;margin:0 0 1em;color:var(--rink);
  text-align:justify;hyphens:auto;-webkit-hyphens:auto;text-indent:2em}
.reader.ff-sans .r-pages p{font-family:-apple-system,'Manrope',system-ui,sans-serif}
.reader.ff-times .r-pages p{font-family:'Tishina Times',Georgia,serif}
.r-pages p.no-indent,.r-chapter-label + p{text-indent:0}
.r-pages h1,.r-pages h2{font-family:'Cormorant Garamond',serif;font-weight:600;break-after:avoid;margin:0 0 .7em;line-height:1.25;color:var(--rink);font-size:1.4em}
.r-pages h3{font-family:'Cormorant Garamond',serif;font-weight:600;break-after:avoid;margin:0 0 .7em;line-height:1.3;
  color:var(--rink);font-size:1.25em;text-align:center}
.r-pages a.fn{color:#2f7cf6;text-decoration:none;
  font-size:.75em;vertical-align:super;line-height:1;cursor:pointer;
  padding:12px 8px;margin:-12px -8px}
.r-pages img{max-width:100%;height:auto;break-inside:avoid;border-radius:8px}
.r-pages blockquote,.r-pages figure{break-inside:avoid;margin:0 0 1em;padding-left:14px;border-left:3px solid var(--rline);
  font-family:Georgia,serif;font-style:italic;color:var(--rink)}
.r-chapter-label{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:1.5em;
  margin:0 0 18px;break-after:avoid;line-height:1.2;color:var(--rink);text-align:left}
.r-bottom{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom));left:12px;right:12px;z-index:5;
  padding:14px 18px 16px;background:rgba(255,255,255,.97);border-radius:22px;
  box-shadow:0 10px 30px rgba(0,0,0,.18);
  transition:transform .28s ease,opacity .28s ease}
.r-bottom.gone{transform:translateY(140%);opacity:0;pointer-events:none}
.r-bottom .row{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;color:var(--rmuted);
  font-weight:600;margin-bottom:9px}
.r-bottom .row span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* шторка настроек */
.r-set{position:fixed;inset:0;z-index:90;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .25s}
.r-set.open{opacity:1;pointer-events:auto}
/* меню всегда одного цвета — не красятся в фон страниц */
.r-set-card,.r-draw-panel,.r-note-card{
  --rbg:#ffffff;--rink:#1c1c1e;--rmuted:#8e8e93;--rline:#e9e9ee;--rbar:#ffffff;--rbgimg:none}
.r-set-card{width:100%;max-width:560px;background:var(--rbar);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border-radius:22px 22px 0 0;padding:8px 22px calc(24px + env(safe-area-inset-bottom));
  transform:translateY(103%);transition:transform .28s ease;color:var(--rink)}
.r-set.open .r-set-card{transform:none}
.r-set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;
  border-bottom:1px solid var(--rline);font-weight:700;font-size:15px}
.r-set-row:last-child{border-bottom:none}
.seg{display:flex;background:rgba(120,120,128,.16);border-radius:12px;padding:3px;gap:2px}
.seg button{border:none;background:none;font-family:inherit;font-weight:700;font-size:13.5px;padding:8px 13px;
  border-radius:9px;cursor:pointer;color:var(--rink)}
.seg button.on{background:var(--rbg);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--rline);background:var(--rbg);
  color:var(--rink);font-size:15px;font-weight:800;cursor:pointer;font-family:inherit}
.stepper button:active{transform:scale(.93)}
#fsVal{min-width:30px;text-align:center;font-size:16px}
.r-row-right{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.r-gear{border:none;background:none;font-size:17px;color:var(--rmuted);cursor:pointer;padding:2px 4px;font-family:inherit}
.r-gear:active{transform:rotate(40deg)}

/* выбор фона */
.bg-pick{display:flex;gap:4px;flex-wrap:wrap}
.bg-pick button{border:none;background:none;font-family:inherit;font-size:11px;font-weight:700;color:var(--rmuted);
  display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;padding:4px 2px;min-width:54px}
.bg-pick button i{width:44px;height:44px;border-radius:50%;display:block;
  border:1px solid var(--rline);box-shadow:inset 0 0 0 3px rgba(255,255,255,.22)}
.bg-pick [data-bg="white"] i{background:#ffffff}
.bg-pick [data-bg="cream"] i{background:#f3f0e4 url('bg/cream.png')}
.bg-pick [data-bg="sepia"] i{background:#f3e9d2}
.bg-pick [data-bg="blue"] i{background:#98babc url('bg/blue.png')}
.bg-pick [data-bg="sand"] i{background:#dcc2a1 url('bg/sand.png')}
.bg-pick [data-bg="night"] i{background:#17171a}
.bg-pick button.on{color:var(--rink)}
.bg-pick button.on i{box-shadow:0 0 0 2px var(--rbg),0 0 0 4px var(--rink)}

/* шторка глав/закладок */
.r-draw{position:absolute;inset:0;z-index:11;pointer-events:none}
.r-draw::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.35);opacity:0;transition:opacity .3s}
.r-draw.open{pointer-events:auto}
.r-draw.open::after{opacity:1}
.r-draw-panel{position:absolute;top:0;bottom:0;left:0;width:min(340px,88%);z-index:1;
  background-color:var(--rbg);background-image:var(--rbgimg);color:var(--rink);
  border-right:1px solid var(--rline);display:flex;flex-direction:column;
  transform:translateX(-104%);transition:transform .32s cubic-bezier(0.25,0.46,0.45,0.94);
  padding-top:env(safe-area-inset-top);box-shadow:10px 0 34px rgba(0,0,0,.2)}
.r-draw.open .r-draw-panel{transform:none}
.r-draw-head{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:14px 14px 12px;border-bottom:1px solid var(--rline)}
.r-draw-list{flex:1;overflow-y:auto;padding:4px 0;-webkit-overflow-scrolling:touch}
.ch-row{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  border:none;background:none;text-align:left;font-family:inherit;cursor:pointer;
  font-size:15px;font-weight:600;color:var(--rink);padding:13px 20px;
  border-bottom:1px dashed var(--rline)}
.ch-row .tick{color:#c65b4e;font-weight:800;flex:0 0 auto}
.ch-row.cur .ch-label{font-weight:800}
.bm-add{display:block;width:calc(100% - 40px);margin:12px 20px;padding:12px;border-radius:14px;
  border:1.5px dashed var(--rmuted);background:none;color:var(--rink);font-family:inherit;
  font-size:14px;font-weight:700;cursor:pointer}
.bm-row{display:flex;align-items:flex-start;gap:6px;border-bottom:1px dashed var(--rline);padding:12px 12px 12px 20px}
.bm-go{flex:1;min-width:0;border:none;background:none;text-align:left;font-family:inherit;cursor:pointer;padding:0;color:var(--rink)}
.bm-snippet{font-size:14px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bm-meta{font-size:12px;color:var(--rmuted);margin-top:5px;font-weight:600}
.bm-del{border:none;background:none;color:var(--rmuted);font-size:15px;cursor:pointer;padding:4px 8px;font-family:inherit;flex:0 0 auto}
.bm-empty{padding:26px 20px;color:var(--rmuted);font-size:14px;text-align:center}
.about-wrap{padding:18px 22px 26px;text-align:center}
.about-cover img{width:120px;border-radius:8px;box-shadow:0 10px 26px rgba(0,0,0,.25)}
.about-cover .cover-ph{width:120px;aspect-ratio:2/3;margin:0 auto;border-radius:8px;
  background:linear-gradient(135deg,#3a3a3f,#6b6b72);color:#fff;display:flex;align-items:center;
  justify-content:center;font-family:'Cormorant Garamond',serif;font-size:16px;padding:10px;
  box-shadow:0 10px 26px rgba(0,0,0,.25)}
.about-title{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:22px;margin:14px 0 2px}
.about-author{color:var(--rmuted);font-size:14px;margin-bottom:14px}
.about-desc{color:var(--rink);font-size:14.5px;line-height:1.6;text-align:justify;margin:0 0 12px}
.about-desc.empty{color:var(--rmuted);text-align:center}
.about-meta{color:var(--rmuted);font-size:12.5px;font-weight:700}
.r-draw-foot{padding:12px 20px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--rline);
  font-size:13px;font-weight:700;color:var(--rmuted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-set-row-col{flex-direction:column;align-items:stretch;gap:10px}
.fx-group{display:flex;flex-wrap:wrap;gap:8px}
.fx-group button{border:none;background:rgba(120,120,128,.16);font-family:inherit;font-weight:700;font-size:13px;
  padding:9px 14px;border-radius:999px;cursor:pointer;color:var(--rink)}
.fx-group button.on{background:var(--rink);color:var(--rbg)}

/* попап сноски */
.r-note{position:absolute;inset:0;z-index:9;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(0,0,0,.32);opacity:0;pointer-events:none;transition:opacity .25s}
.r-note.open{opacity:1;pointer-events:auto}
.r-note-card{width:100%;max-width:560px;max-height:62%;overflow-y:auto;background:var(--rbar);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);color:var(--rink);
  border-radius:22px 22px 0 0;padding:14px 24px calc(28px + env(safe-area-inset-bottom));
  transform:translateY(103%);transition:transform .28s ease}
.r-note.open .r-note-card{transform:none}
.r-note-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.r-note-title{font-weight:800;font-size:14px;color:var(--rmuted);text-transform:uppercase;letter-spacing:.06em}
.r-note-x{border:none;background:var(--rline);width:32px;height:32px;border-radius:50%;font-size:15px;
  color:var(--rink);cursor:pointer;font-family:inherit}
.r-note-text{font-family:Georgia,serif;font-size:16.5px;line-height:1.65;text-align:justify}
.reader.ff-times .r-note-text{font-family:'Tishina Times',Georgia,serif}
.reader.ff-sans .r-note-text{font-family:-apple-system,'Manrope',system-ui,sans-serif}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1 id="pageTitle">Читаю сейчас</h1>
    <button class="add-btn" id="addBtn" title="Добавить книгу">+</button>
  </div>
  <div id="viewNow"></div>
  <div id="viewLib" class="hidden"></div>
</div>

<nav class="tabbar"><div class="tabs">
  <button class="tab on" data-tab="now">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5.5A2.5 2.5 0 0 1 4.5 3H20v15H4.5A2.5 2.5 0 0 0 2 20.5z"/><path d="M2 20.5A2.5 2.5 0 0 1 4.5 18H20"/></svg>
    Сейчас
  </button>
  <button class="tab" data-tab="lib">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4" width="7" height="7" rx="1.5"/><rect x="14" y="4" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    Библиотека
  </button>
</div></nav>

<div class="detail" id="detail">
  <div class="d-hero" id="dHero">
    <div class="d-hero-bg" id="dHeroBg"></div>
    <div class="d-nav">
      <button class="d-navbtn" id="dClose">←</button>
      <button class="d-navbtn" id="dGear">⚙</button>
    </div>
    <div class="d-cover" id="dCover"></div>
  </div>
  <div class="d-body">
    <h2 id="dTitle"></h2>
    <p class="da" id="dAuthor"></p>
    <button class="read-btn d-read" id="dRead">Читать</button>
    <div class="d-prog" id="dProg" hidden>
      <div class="d-prog-info">
        <div class="d-prog-t">Прогресс чтения</div>
        <div class="d-prog-s">Продолжите с того же места</div>
      </div>
      <div class="ring"><svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="19" class="ring-bg"/><circle cx="22" cy="22" r="19" class="ring-fg" id="dRingFg"/></svg><span id="dPct">0%</span></div>
    </div>
    <div class="d-sec" id="dDescSec" hidden>
      <div class="d-sec-t">Описание</div>
      <p class="d-desc" id="dDesc"></p>
    </div>
    <div class="d-sec">
      <div class="d-sec-t">Оглавление</div>
      <div class="d-toc" id="dToc"></div>
    </div>
    <button class="d-del" id="dDel">Удалить книгу</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept=".epub,.fb2,.zip" class="hidden">

<div class="reader" id="reader">
  <div class="r-top" id="rTop">
    <button class="r-back" id="rBack">←</button>
    <button class="r-back" id="rMenu">☰</button>
    <div class="r-title" id="rTitle"></div>
    <button class="r-aa" id="rAa">Aa</button>
    <div class="r-pct" id="rPct"></div>
  </div>
  <div class="r-content" id="rContent"><div class="r-pages" id="rPages"></div></div>
  <div class="r-bottom" id="rBottom">
    <div class="row"><span id="rCh"></span><span id="rPageInfo"></span></div>
    <div class="pbar"><i id="rBar"></i></div>
  </div>
  <div class="r-note" id="rNote">
    <div class="r-note-card">
      <div class="r-note-head"><span class="r-note-title">Пояснение</span><button class="r-note-x" id="rNoteX">✕</button></div>
      <div class="r-note-text" id="rNoteText"></div>
    </div>
  </div>
  <div class="r-draw" id="rDraw">
    <div class="r-draw-panel">
      <div class="r-draw-head">
        <div class="seg" id="drawTabs">
          <button data-tab="ch" class="on">Главы</button><button data-tab="bm">Закладки</button><button data-tab="about">О книге</button>
        </div>
        <button class="r-note-x" id="rDrawX">✕</button>
      </div>
      <div class="r-draw-list" id="rDrawCh"></div>
      <div class="r-draw-list" id="rDrawBm" hidden>
        <button class="bm-add" id="bmAdd">+ Добавить закладку</button>
        <div id="rBmList"></div>
      </div>
      <div class="r-draw-list" id="rDrawAbout" hidden>
        <div class="about-wrap">
          <div class="about-cover" id="abCover"></div>
          <div class="about-title" id="abTitle"></div>
          <div class="about-author" id="abAuthor"></div>
          <p class="about-desc" id="abDesc"></p>
          <div class="about-meta" id="abMeta"></div>
        </div>
      </div>
      <div class="r-draw-foot" id="rDrawFoot"></div>
    </div>
  </div>
</div>

  <div class="r-set" id="rSet">
    <div class="r-set-card">
      <div class="r-set-row"><span>Размер шрифта</span>
        <div class="stepper"><button id="fsMinus">A−</button><span id="fsVal">19</span><button id="fsPlus">A+</button></div>
      </div>
      <div class="r-set-row"><span>Шрифт</span>
        <div class="seg" id="fontSeg"><button data-font="serif" class="on">Serif</button><button data-font="times">Times</button><button data-font="sans">Sans</button></div>
      </div>
      <div class="r-set-row r-set-row-col"><span>Фон страниц</span>
        <div class="bg-pick" id="bgPick">
          <button data-bg="white" class="on"><i></i>Белый</button><button data-bg="cream"><i></i>Крем</button><button data-bg="sepia"><i></i>Сепия</button><button data-bg="blue"><i></i>Голубой</button><button data-bg="sand"><i></i>Песочный</button><button data-bg="night"><i></i>Ночь</button>
        </div>
      </div>

<script>
(async () => {
  try {
    await Reader.open("miz");
    await new Promise(r => setTimeout(r, 800));
    const a = document.querySelector('a.fn[data-fn="n_46"]');
    if (!a) { document.title = "NOLINK"; return; }
    const r = a.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    // настоящий тач: touchstart -> touchend -> click
    const t = new Touch({ identifier: 1, target: a, clientX: cx, clientY: cy });
    a.dispatchEvent(new TouchEvent("touchstart", { touches: [t], bubbles: true, cancelable: true }));
    a.dispatchEvent(new TouchEvent("touchend", { changedTouches: [t], bubbles: true, cancelable: true }));
    a.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, clientX: cx, clientY: cy }));
    await new Promise(r => setTimeout(r, 300));
    document.title = document.getElementById("rNote").classList.contains("open") ? "POPUP_OK" : "POPUP_FAIL";
  } catch (e) { document.title = "ERR " + (e && e.message); }
})();</script>
